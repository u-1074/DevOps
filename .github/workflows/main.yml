name: "CI/CD intro"

on: [push]

jobs:
  print_msg:
    runs-on: ubuntu-latest
    steps:
       - run: echo "Introduction to pipeline"
  print_name:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ vars.NAME }}"

  print_surname:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ vars.SURNAME }}"

  print_email:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ vars.EMAIL }}"

      
